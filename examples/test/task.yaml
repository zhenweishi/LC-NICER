Task_Name: "test"

Datasets:
  lung:
    type: testing
    path: data.csv

Preprocessing:
  use_multiprocessing: true
  Pipeline: 
    - resample

VariousMask:
  use_multiprocessing: true
  # Copy the original images to the output directory
  # otherwise, the symlink will be created, this may cause the error
  CopyImages: true 
  KernelSizes: 
    - 3
    - 5
    - 7
  MaskTypes:
    - tumor
    - peritumor

PreSegmentation:
  use_multiprocessing: true
  max_workers: null
  CopyImages: true
  SVMaxParts: 100
  EachSVMinPixels: 343 # 7 * 7 * 7

FeatureExtraction#SV:
  use_multiprocessing: false
  parallel_type: "process" # thread or process
  params: ../../configs/feature_extraction/CT_tumor_he.yaml
  skip_errors: true

DeepLearningFeatureExtraction#SV:
  mae3d_lung_CT:
    root: ../../configs/dl_feature_extraction/mae3d_lung_CT

Compose#SV-DL-PCA16:
  Normalization: 
    method: StandardScaler
    reference: null

  Decomposition: # https://scikit-learn.org/stable/api/sklearn.decomposition.html
    method: PCA
    kwargs:
      n_components: 16
    reference: null 

Normalization#01: 
  method: MinMaxScaler
  reference: null
  pickle: # key: dataset_name, value: model_path
    peritumor#3#lung: pkl/Normalization#01/peritumor#3#lung#Rad+DL.pkl
    peritumor#5#lung: pkl/Normalization#01/peritumor#5#lung#Rad+DL.pkl
    peritumor#7#lung: pkl/Normalization#01/peritumor#7#lung#Rad+DL.pkl
    tumor#lung:       pkl/Normalization#01/tumor#lung#Rad+DL.pkl

FeatureFusion#SV-Rad+DL:
  method: concat
  column_names: ["{old_name}", "{old_name}"]

SubRegionClustering:
  use_multiprocessing: true
  CopyImages: true

  predict:
    pickle: # key: dataset_name, value: model_path
      peritumor#3#lung: pkl/SubRegionClustering/peritumor#3#lung#Rad+DL.pkl
      peritumor#5#lung: pkl/SubRegionClustering/peritumor#5#lung#Rad+DL.pkl
      peritumor#7#lung: pkl/SubRegionClustering/peritumor#7#lung#Rad+DL.pkl
      tumor#lung: pkl/SubRegionClustering/tumor#lung#Rad+DL.pkl

DeepLearningFeatureExtraction#SR:
  mae3d_lung_CT:
    root: ../../configs/dl_feature_extraction/mae3d_lung_CT

FeatureExtraction#SR:
  use_multiprocessing: true
  parallel_type: "process" # thread or process
  params: ../../configs/feature_extraction/CT_tumor_he.yaml
  skip_errors: true

Compose#SR-DL-PCA1:
  Normalization:
    method: StandardScaler
    reference: null
  Decomposition:
    method: PCA
    kwargs:
      n_components: 1
    reference: null 

FeatureFusion#SR-Rad+DL:
  method: concat
  column_names: ["{old_name}", "{old_name}"]

TumorHeterogeneity:
  predict:
    pickle_dir:
      peritumor#3#lung: pkl/TumorHeterogeneity/peritumor#3#lung#Rad+DL#Rad+DL
      peritumor#5#lung: pkl/TumorHeterogeneity/peritumor#5#lung#Rad+DL#Rad+DL
      peritumor#7#lung: pkl/TumorHeterogeneity/peritumor#7#lung#Rad+DL#Rad+DL
      tumor#lung: pkl/TumorHeterogeneity/tumor#lung#Rad+DL#Rad+DL


FeatureExtraction#Tumor:
  use_multiprocessing: true
  parallel_type: "process" # thread or process
  params: ../../configs/feature_extraction/CT_tumor.yaml
  skip_errors: true

Cropper:
  method: all_roi_resize
  largest_connected_component: false
  size: 48
  use_multiprocessing: true

DeepLearningFeatureExtraction#Tumor:
  mae3d_lung_CT:
    root: ../../configs/dl_feature_extraction/mae3d_lung_CT